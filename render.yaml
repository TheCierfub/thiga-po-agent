services:
  - type: web
    name: etai-agent-po
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm exec next start --port $PORT
    healthCheckPath: /lundi
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LINEAR_API_KEY
        sync: false
      - key: LINEAR_TEAM_ID
        sync: false
      - key: LINEAR_KEY_COOKIE_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: QUOTA_STORY_PER_USER
        sync: false
      - key: QUOTA_FEEDBACK_PER_USER
        sync: false
      - key: QUOTA_EXPORT_PER_USER
        sync: false
      - key: QUOTA_STORY_GLOBAL
        sync: false
      - key: QUOTA_EXPORT_GLOBAL
        sync: false
      - key: QUOTA_MAGIC_EMAIL
        sync: false
      - key: QUOTA_MAGIC_IP
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TREG_TOKEN
        sync: false
      - key: ETAI_X_QUERY
        sync: false
      - key: ETAI_X_POLL_SECONDS
        sync: false
      - key: ETAI_X_MAX_SESSION_USD
        sync: false
      - key: ETAI_X_MAX_AGE_DAYS
        sync: false
